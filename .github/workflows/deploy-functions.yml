# Deploys the Supabase edge functions without a terminal.
#
# One-time setup (docs/SETUP.md, part C): add two repository secrets in GitHub,
# SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF. After that, every push to main
# that touches the functions (or the shared/ contract) redeploys them, and the
# "Run workflow" button on the Actions tab deploys on demand.
name: Deploy edge functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "shared/**"
      - ".github/workflows/deploy-functions.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check the secrets are present
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Add the SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF repository secrets first (docs/SETUP.md, part C)." >&2
            exit 1
          fi
      - name: Deploy every function
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
