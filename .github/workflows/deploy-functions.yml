# Deploys the Supabase edge functions without a terminal.
#
# One-time setup (docs/SETUP.md, part C): add two repository secrets in GitHub,
# SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF. After that, every push to main
# that touches the functions (or the shared/ contract) redeploys them, and the
# "Run workflow" button on the Actions tab deploys on demand.
name: Deploy edge functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "shared/**"
      - "kit/**"
      - "scripts/pack-kit.mjs"
      - ".github/workflows/deploy-functions.yml"

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Pack the kit for update-kit
        # Regenerates supabase/functions/update-kit/kit-package.json so the bundled
        # kit always matches what the current commit's kit/ folder ships.
        run: node scripts/pack-kit.mjs
      - name: Check the secrets are present
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning::Skipping the deploy: add the SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF repository secrets first (docs/SETUP.md, part C), then run this workflow again."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Delete stats-ingest (removed in kit 2.9.0; safe when already gone)
        if: steps.check.outputs.configured == 'true'
        run: supabase functions delete stats-ingest --project-ref "$SUPABASE_PROJECT_REF" || true
      - name: Delete finish-setup (removed with the test-branch flow; safe when already gone)
        if: steps.check.outputs.configured == 'true'
        run: supabase functions delete finish-setup --project-ref "$SUPABASE_PROJECT_REF" || true
      - name: Deploy every function
        if: steps.check.outputs.configured == 'true'
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
