<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Site flips to Connected">
  <title>Site flips to Connected</title>
  <desc>The Kit card on Site settings turning green as the site flips from Needs setup to Connected, with Undo setup right below.</desc>
  <rect x="0" y="0" width="800" height="450" fill="#F5F7F9"/>
  <rect x="8" y="8" width="784" height="434" rx="14" fill="#FFFFFF" stroke="#16202B" stroke-width="1.5"/>
  <rect x="8" y="8" width="784" height="46" rx="14" fill="#16202B"/>
  <rect x="8" y="40" width="784" height="14" fill="#16202B"/>
  <circle cx="30" cy="31" r="6" fill="#F5F7F9"/>
  <circle cx="52" cy="31" r="6" fill="#F5F7F9"/>
  <circle cx="74" cy="31" r="6" fill="#F5F7F9"/>
  <text x="112" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#FFFFFF" font-weight="600">Site settings — Connection</text>
  <text x="40" y="105" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#2B3FD6" font-weight="700" letter-spacing="1">SECTION 3 — STEP 4</text>
  <text x="40" y="150" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" fill="#16202B" font-weight="700">Connected + Undo setup</text>
  <rect x="40" y="180" width="180" height="30" rx="15" fill="#DDF4E4" stroke="#26934C" stroke-width="1"/>
  <text x="65" y="200" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#26934C" font-weight="700">Kit · Up to date</text>
  <text x="40" y="248" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#465666">The site flipped from Needs setup to Connected on its own after Netlify rebuilt.</text>
  <rect x="40" y="280" width="180" height="34" rx="8" fill="#FFFFFF" stroke="#16202B" stroke-width="1.5"/>
  <text x="70" y="303" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#16202B" font-weight="600">Undo setup…</text>
  <text x="40" y="335" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#465666">One click restores the pre-setup state as a single revert commit.</text>
  <rect x="40" y="360" width="720" height="52" rx="10" fill="#F5F7F9" stroke="#E5E9EF" stroke-width="1"/>
  <circle cx="66" cy="386" r="8" fill="#2B3FD6"/>
  <text x="86" y="391" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#465666">Placeholder screenshot — replace with a real capture when you have one.</text>
</svg>
