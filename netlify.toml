# Netlify configuration for the Armature dashboard (a single-page app).
[build]
  command = "npm run build"
  publish = "dist"

# Every path is served by index.html so React Router can handle it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
